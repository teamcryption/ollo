<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- ollo plugin panel. scripts/build.mjs inlines the bundled ui.ts into the last script tag. -->
<style>
  /* Tokens from the Design System (DS Color light/dark); Figma sets .figma-dark on <html>. */
  :root {
    --bg: #ffffff; --surface: #ffffff; --subtle: #f4f4f5; --muted: #e9e9eb; --border: #e9e9eb; --border-strong: #dadadd;
    --text: #0a0a0b; --text-2: #4c4c52; --text-3: #6a6a70; --brand: #3a57ff; --brand-subtle: #eef1ff; --ring: #3a57ff2e;
    --inverse: #141416; --on-inverse: #ffffff; --icon: #171729;
  }
  html.figma-dark {
    --bg: #141416; --surface: #1b1b1e; --subtle: #1b1b1e; --muted: #323236; --border: #232326; --border-strong: #323236;
    --text: #f4f4f5; --text-2: #bcbcc0; --text-3: #8e8e93; --brand: #3a57ff; --brand-subtle: #0f163d; --ring: #6b80ff3d;
    --inverse: #f4f4f5; --on-inverse: #0a0a0b; --icon: #f4f4f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/18px Figtree, Inter, system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  header { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 10px; border-bottom: 1px solid var(--border); }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--subtle); border: 1px solid var(--border); }
  .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--text); font: inherit; }
  .search svg { color: var(--text-3); flex-shrink: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-2); font-weight: 500; font-size: 12px; }
  .chip[aria-checked='true'] { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 0 0 3px var(--ring); }
  .badge-pro { height: 16px; padding: 0 5px; border-radius: 999px; background: var(--inverse); color: var(--on-inverse); font-size: 9px; line-height: 16px; font-weight: 600; letter-spacing: .3px; }
  #status { margin: 0; color: var(--text-3); font-size: 12px; }
  #status code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; }
  main { flex: 1; overflow-y: auto; padding: 10px 12px; }
  #grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
  .tile { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--icon); transition: background-color .12s, border-color .12s; }
  .tile:hover { background: var(--muted); border-color: var(--border-strong); }
  .tile:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
  .tile svg { width: 24px; height: 24px; }
  .tile.is-busy { opacity: .5; }
  .tile.is-done { background: var(--brand-subtle); border: 1.5px solid var(--brand); box-shadow: 0 0 0 4px var(--ring); }
  .empty { grid-column: 1 / -1; padding: 32px 0; text-align: center; color: var(--text-3); }
  footer { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .plan { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 500; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
  .track { position: relative; width: 32px; height: 20px; border-radius: 10px; background: var(--border-strong); transition: background-color .2s; }
  .thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked='true'] .track { background: var(--brand); }
  .switch[aria-checked='true'] .thumb { transform: translateX(12px); }
  #plan-note { margin: 0; color: var(--text-3); font-size: 11px; line-height: 15px; }
</style>
<header>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11 18.5a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15ZM16.5 16.5l4 4" /></svg>
    <input id="q" type="search" placeholder="Search icons, e.g. home, notification" aria-label="Search icons" autofocus />
  </label>
  <div class="chips" id="styles" role="radiogroup" aria-label="Style"></div>
  <p id="status">Loading…</p>
</header>
<main><ul id="grid" role="list"></ul></main>
<footer>
  <div class="plan">
    <span>Click an icon to insert it as a component</span>
    <button class="switch" id="pro" role="switch" aria-checked="false" title="Until sign-in exists, this unlocks Pro styles for testing">
      <span class="track"><span class="thumb"></span></span>Pro
    </button>
  </div>
  <p id="plan-note"></p>
</footer>
<script>window.__OLLO__ = { data: 'http://localhost:3100/data/' };</script>
